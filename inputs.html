<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Form inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); font-family: var(--font-body); color: var(--fg-default); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: var(--fg-muted); }
  .input {
    font: 400 14px/1.2 var(--font-body);
    color: var(--fg-strong);
    padding: 10px 12px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    background: #fff;
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
  }
  .input:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgb(37 99 235 / 0.18); }
  .input.mono { font-family: var(--font-mono); }
  .checkbox { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg-default); }
  .check { width: 16px; height: 16px; border: 1px solid var(--border-strong); border-radius: 4px; display:flex; align-items:center; justify-content:center; background:#fff; }
  .check.on { background: var(--brand-primary); border-color: var(--brand-primary); color:#fff; font-size: 11px; }
</style>
</head>
<body>
<div class="grid">
  <label>ФИО пациента <input class="input" value="Иванов И. И."/></label>
  <label>Возраст <input class="input mono" value="58"/></label>
  <label>NLR <input class="input mono" value="2.34"/></label>
  <label>MLR <input class="input mono" value="0.28"/></label>
  <div class="checkbox"><span class="check on">✓</span>Учитывать историю АД</div>
  <div class="checkbox"><span class="check"></span>Передать в лабораторию</div>
</div>
</body>
</html>
