<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: 22px 26px; background: var(--bg-page); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; }
  .cell { border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .cell i { color: var(--brand-primary); }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); text-align: center; }
  .foot { margin-top: 14px; font-size: 11px; color: var(--fg-subtle); }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><i data-lucide="heart-pulse"></i><span class="n">heart-pulse</span></div>
  <div class="cell"><i data-lucide="activity"></i><span class="n">activity</span></div>
  <div class="cell"><i data-lucide="stethoscope"></i><span class="n">stethoscope</span></div>
  <div class="cell"><i data-lucide="test-tube-2"></i><span class="n">test-tube-2</span></div>
  <div class="cell"><i data-lucide="microscope"></i><span class="n">microscope</span></div>
  <div class="cell"><i data-lucide="brain-circuit"></i><span class="n">brain-circuit</span></div>
  <div class="cell"><i data-lucide="shield-check"></i><span class="n">shield-check</span></div>
  <div class="cell"><i data-lucide="line-chart"></i><span class="n">line-chart</span></div>
  <div class="cell"><i data-lucide="bar-chart-3"></i><span class="n">bar-chart-3</span></div>
  <div class="cell"><i data-lucide="trending-up"></i><span class="n">trending-up</span></div>
  <div class="cell"><i data-lucide="file-text"></i><span class="n">file-text</span></div>
  <div class="cell"><i data-lucide="users"></i><span class="n">users</span></div>
  <div class="cell"><i data-lucide="hospital"></i><span class="n">hospital</span></div>
  <div class="cell"><i data-lucide="flask-conical"></i><span class="n">flask-conical</span></div>
  <div class="cell"><i data-lucide="award"></i><span class="n">award</span></div>
  <div class="cell"><i data-lucide="book-open"></i><span class="n">book-open</span></div>
</div>
<div class="foot">Lucide · 24×24 · 2 px stroke · currentColor</div>
<script>lucide.createIcons();</script>
</body>
</html>
