<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px 32px; background: var(--bg-page); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }
  .cell {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
    min-height: 96px;
  }
  .cell.dark { background: var(--slate-900); border-color: var(--slate-900); }
  .cell img { height: 36px; }
  .mark { display: flex; gap: 14px; align-items: center; }
  .mark img { height: 44px; }
  .tag {
    font-size: var(--text-xs); color: var(--fg-subtle); font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    margin-top: 10px; display: block;
  }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="cell"><img src="../assets/logo.svg" alt="LeukoCheck"/></div>
      <span class="tag">Primary lockup — light</span>
    </div>
    <div>
      <div class="cell dark">
        <img src="../assets/logo.svg" alt="LeukoCheck" style="filter: invert(1) hue-rotate(180deg) saturate(1.2);"/>
      </div>
      <span class="tag">On dark</span>
    </div>
  </div>
</body>
</html>
