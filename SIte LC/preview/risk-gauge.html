<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Risk gauge</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); font-family: var(--font-body); }
  .card { border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 20px 22px; display: grid; grid-template-columns: 1fr 1.3fr; gap: 24px; align-items: center; }
  .meter {
    position: relative;
    height: 10px; border-radius: 9999px; overflow: hidden;
    background: linear-gradient(to right, #059669 0%, #D97706 50%, #DC2626 100%);
  }
  .meter::after {
    content: ''; position: absolute; top: -5px; left: 62%; transform: translateX(-50%);
    width: 4px; height: 20px; background: #0F172A; border-radius: 2px;
  }
  .ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); margin-top: 8px; }
  .score { font-family: var(--font-mono); font-size: 44px; font-weight: 500; color: #B45309; letter-spacing: -0.02em; font-feature-settings: 'tnum' 1; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 9999px; background: #FFFBEB; color: #B45309; width: fit-content; margin-top: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #D97706; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="label">5-year risk · ИБС</div>
    <div class="score">14.2%</div>
    <span class="badge"><span class="dot"></span>Погранично</span>
  </div>
  <div>
    <div class="meter"></div>
    <div class="ticks"><span>0</span><span>5</span><span>10</span><span>15</span><span>20+</span></div>
  </div>
</div>
</body>
</html>
