<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); font-family: var(--font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
    padding: 4px 10px; border-radius: var(--radius-pill);
    border: 1px solid transparent;
  }
  .badge.info { background: var(--brand-primary-wash); color: var(--brand-primary-hover); }
  .badge.accent { background: var(--brand-accent-soft); color: #0F766E; }
  .badge.neutral { background: var(--slate-100); color: var(--slate-700); border-color: var(--slate-200); }
  .badge.high { background: #FEF2F2; color: #B91C1C; }
  .badge.med { background: #FFFBEB; color: #B45309; }
  .badge.low { background: #ECFDF5; color: #047857; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); width: 64px; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">status</span>
    <span class="badge info">TRL 6</span>
    <span class="badge accent">AI</span>
    <span class="badge neutral">Патент RU</span>
    <span class="badge neutral">Мета-анализ</span>
  </div>
  <div class="row">
    <span class="label">risk</span>
    <span class="badge high"><span class="dot" style="background:#DC2626"></span>Высокий риск</span>
    <span class="badge med"><span class="dot" style="background:#D97706"></span>Погранично</span>
    <span class="badge low"><span class="dot" style="background:#059669"></span>Низкий риск</span>
  </div>
</body>
</html>
