<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 28px; background: var(--slate-50); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .card {
    width: 130px; height: 84px;
    background: var(--white);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-default);
  }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-strong); }
  .desc { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="cell">
    <div class="card" style="box-shadow:none"></div>
    <div class="name">none</div>
    <div class="desc">default · border only</div>
  </div>
  <div class="cell">
    <div class="card" style="box-shadow:0 1px 2px rgb(15 23 42 / 0.04)"></div>
    <div class="name">xs</div>
    <div class="desc">resting</div>
  </div>
  <div class="cell">
    <div class="card" style="box-shadow:0 4px 12px rgb(15 23 42 / 0.06), 0 2px 4px rgb(15 23 42 / 0.04)"></div>
    <div class="name">md</div>
    <div class="desc">hover / menus</div>
  </div>
  <div class="cell">
    <div class="card" style="box-shadow:0 12px 32px rgb(15 23 42 / 0.08)"></div>
    <div class="name">lg</div>
    <div class="desc">floating / modal</div>
  </div>
</div>
</body>
</html>
