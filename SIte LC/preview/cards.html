<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--slate-50); font-family: var(--font-body); color: var(--fg-default); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .card.featured { border-color: var(--brand-primary); position: relative; }
  .tick {
    position: absolute; top: 14px; right: 14px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--brand-primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brand-primary); }
  h4 { font-family: var(--font-display); font-size: 17px; margin: 6px 0 8px; color: var(--fg-strong); letter-spacing: -0.01em; font-weight: 600; }
  p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--fg-muted); }
  .icon { width: 32px; height: 32px; border-radius: 8px; background: var(--brand-primary-wash); color: var(--brand-primary); display:flex; align-items:center; justify-content:center; margin-bottom: 10px; }
  svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="icon"><svg><path d="M3 12h3l3-9 4 18 3-9h5"/></svg></div>
    <div class="eyebrow">Технология</div>
    <h4>Лейкоцитарные индексы</h4>
    <p>NLR, MLR и ИСНМ рассчитываются из рутинного ОАК и служат входами модели.</p>
  </div>
  <div class="card featured">
    <div class="tick">✓</div>
    <div class="icon"><svg><path d="M12 2v6M12 22v-6M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M22 12h-6M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24"/></svg></div>
    <div class="eyebrow">Рекомендовано</div>
    <h4>Нейросетевая модель</h4>
    <p>Многослойная сеть, валидированная на когорте 1 240 пациентов. AUC 0,82.</p>
  </div>
</div>
</body>
</html>
