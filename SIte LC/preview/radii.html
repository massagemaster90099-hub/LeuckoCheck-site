<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .swatch { width: 84px; height: 64px; background: var(--brand-primary-wash); border: 1px solid var(--brand-primary); }
  .name { font-size: 12px; font-weight: 600; color: var(--fg-strong); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="cell"><div class="swatch" style="border-radius:6px"></div><div class="name">sm</div><div class="px">6 px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:10px"></div><div class="name">md</div><div class="px">10 px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:12px"></div><div class="name">lg</div><div class="px">12 px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:16px"></div><div class="name">xl</div><div class="px">16 px</div></div>
  <div class="cell"><div class="swatch" style="border-radius:9999px"></div><div class="name">pill</div><div class="px">9999 px</div></div>
</div>
</body>
</html>
