<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Display type</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px dashed var(--border-default); }
  .row:last-child { border: 0; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); min-width: 120px; }
  .sample { font-family: var(--font-display); color: var(--fg-strong); letter-spacing: -0.02em; }
  .h1 { font-size: 48px; font-weight: 600; line-height: 1.05; }
  .h2 { font-size: 30px; font-weight: 600; line-height: 1.15; }
  .h3 { font-size: 22px; font-weight: 600; }
  .h4 { font-size: 18px; font-weight: 600; }
</style>
</head>
<body>
  <div class="row"><span class="spec">H1 · 48 / 600</span><span class="sample h1">Скрининг риска ССЗ</span></div>
  <div class="row"><span class="spec">H2 · 30 / 600</span><span class="sample h2">Как работает LeukoCheck</span></div>
  <div class="row"><span class="spec">H3 · 22 / 600</span><span class="sample h3">Научная база и валидация</span></div>
  <div class="row"><span class="spec">H4 · 18 / 600</span><span class="sample h4">Inter Tight · Cyrillic ready</span></div>
</body>
</html>
