<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mono / data</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); font-family: var(--font-body); color: var(--fg-default); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tile {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 14px 16px;
  }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); letter-spacing: 0.04em; text-transform: uppercase; }
  .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; color: var(--fg-strong); letter-spacing: -0.02em; margin-top: 4px; font-feature-settings: 'tnum' 1; }
  .u { font-family: var(--font-body); font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="tile"><div class="k">AUC</div><div class="v">0.82</div><div class="u">external validation</div></div>
  <div class="tile"><div class="k">NLR</div><div class="v">2.34</div><div class="u">ratio</div></div>
  <div class="tile"><div class="k">MLR</div><div class="v">0.28</div><div class="u">ratio</div></div>
  <div class="tile"><div class="k">SBP / DBP</div><div class="v">128/82</div><div class="u">mm Hg</div></div>
</div>
</body>
</html>
