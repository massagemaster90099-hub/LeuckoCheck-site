<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Neutral Ramp</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); }
  .ramp {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 0;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .step {
    aspect-ratio: 1;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 8px;
    font-family: var(--font-mono);
    font-size: 10px;
  }
  .step .n { font-weight: 600; }
  .step .h { opacity: 0.7; font-size: 9px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="step" style="background:#F8FAFC; color:#334155"><span class="n">50</span><span class="h">F8FAFC</span></div>
    <div class="step" style="background:#F1F5F9; color:#334155"><span class="n">100</span><span class="h">F1F5F9</span></div>
    <div class="step" style="background:#E2E8F0; color:#334155"><span class="n">200</span><span class="h">E2E8F0</span></div>
    <div class="step" style="background:#CBD5E1; color:#334155"><span class="n">300</span><span class="h">CBD5E1</span></div>
    <div class="step" style="background:#94A3B8; color:#FFFFFF"><span class="n">400</span><span class="h">94A3B8</span></div>
    <div class="step" style="background:#64748B; color:#FFFFFF"><span class="n">500</span><span class="h">64748B</span></div>
    <div class="step" style="background:#475569; color:#FFFFFF"><span class="n">600</span><span class="h">475569</span></div>
    <div class="step" style="background:#334155; color:#FFFFFF"><span class="n">700</span><span class="h">334155</span></div>
    <div class="step" style="background:#1F2937; color:#FFFFFF"><span class="n">800</span><span class="h">1F2937</span></div>
    <div class="step" style="background:#0F172A; color:#FFFFFF"><span class="n">900</span><span class="h">0F172A</span></div>
  </div>
</body>
</html>
