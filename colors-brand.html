<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 24px 28px; background: var(--bg-page); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    overflow: hidden;
    background: var(--white);
  }
  .chip { height: 64px; }
  .meta { padding: 10px 12px 12px; }
  .name {
    font-size: var(--text-xs); font-weight: 600;
    color: var(--fg-strong); letter-spacing: 0.02em;
  }
  .hex {
    font-family: var(--font-mono);
    font-size: 11px; color: var(--fg-muted);
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw">
      <div class="chip" style="background:#2563EB"></div>
      <div class="meta"><div class="name">Primary</div><div class="hex">#2563EB</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#1D4ED8"></div>
      <div class="meta"><div class="name">Primary hover</div><div class="hex">#1D4ED8</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#DBEAFE"></div>
      <div class="meta"><div class="name">Primary soft</div><div class="hex">#DBEAFE</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#EFF6FF"></div>
      <div class="meta"><div class="name">Primary wash</div><div class="hex">#EFF6FF</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#14B8A6"></div>
      <div class="meta"><div class="name">Accent</div><div class="hex">#14B8A6</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#0D9488"></div>
      <div class="meta"><div class="name">Accent hover</div><div class="hex">#0D9488</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#CCFBF1"></div>
      <div class="meta"><div class="name">Accent soft</div><div class="hex">#CCFBF1</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#0F172A"></div>
      <div class="meta"><div class="name">Ink</div><div class="hex">#0F172A</div></div>
    </div>
  </div>
</body>
</html>
