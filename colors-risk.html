<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Risk colors</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { margin: 0; padding: 22px 28px; background: var(--bg-page); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card {
    border: 1px solid var(--border-default);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .bar { height: 6px; border-radius: 3px; }
  .label { display: flex; align-items: center; justify-content: space-between; }
  .name { font-weight: 600; font-size: 13px; color: var(--fg-strong); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-muted); }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
    padding: 4px 10px; border-radius: var(--radius-pill);
    width: fit-content;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="bar" style="background:#DC2626"></div>
      <div class="label"><span class="name">Risk — high</span><span class="hex">#DC2626</span></div>
      <span class="tag" style="background:#FEF2F2; color:#DC2626"><span class="dot" style="background:#DC2626"></span>Высокий риск</span>
    </div>
    <div class="card">
      <div class="bar" style="background:#D97706"></div>
      <div class="label"><span class="name">Risk — borderline</span><span class="hex">#D97706</span></div>
      <span class="tag" style="background:#FFFBEB; color:#92400E"><span class="dot" style="background:#D97706"></span>Погранично</span>
    </div>
    <div class="card">
      <div class="bar" style="background:#059669"></div>
      <div class="label"><span class="name">Risk — low</span><span class="hex">#059669</span></div>
      <span class="tag" style="background:#ECFDF5; color:#065F46"><span class="dot" style="background:#059669"></span>Низкий риск</span>
    </div>
  </div>
</body>
</html>
